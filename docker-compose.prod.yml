# Production stack: MySQL + API + Caddy (static site, HTTPS, reverse proxy).
#   cp .env.production.example .env.production   # fill in secrets
#   docker compose -f docker-compose.prod.yml up -d --build
# Data lives in ./data on the host: data/mysql, data/uploads (case files), data/docs (staff workspaces,
# e.g. data/docs/tofig/senedleri/...), data/caddy (TLS certificates).
# Applied to every container: no privilege escalation, bounded logs.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '5'

services:
  db:
    <<: *hardening
    image: mysql:8.4
    restart: unless-stopped
    # The entrypoint fixes data-dir ownership as root, then drops to the mysql user via gosu.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 900m
    pids_limit: 512
    env_file: .env.production
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci', '--max-connections=200']
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 30
    # No ports: the database is reachable only from the other containers.

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    <<: *hardening
    restart: unless-stopped
    # Runs as the unprivileged `node` user (see the Dockerfile) and needs no Linux capabilities.
    cap_drop: [ALL]
    mem_limit: 600m
    pids_limit: 256
    env_file: .env.production
    environment:
      NODE_ENV: production
      TRUST_PROXY: '1'
      UPLOADS_DIR: /data/uploads
      DOCS_DIR: /data/docs
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/docs:/data/docs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:4000/api/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Optional shared store (enable by setting REDIS_URL=redis://redis:6379 in .env.production and
  # uncommenting). Needed only when more than one API instance runs.
  # redis:
  #   <<: *hardening
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory', '128mb', '--maxmemory-policy', 'allkeys-lru']
  #   mem_limit: 160m

  # Mail server for @triad-vision.de (Stalwart: SMTP + IMAP, DKIM/SPF/DMARC, spam filter).
  # Public: 25 (inbound mail), 465 (SMTPS submission), 993 (IMAPS). The management API/WebUI (8080)
  # listens on the host's loopback only — reach it through an SSH tunnel. Mail data: data/mail.
  # TLS for mail.triad-vision.de comes from Let's Encrypt via DNS-01 (Cloudflare API token in
  # data/mail/cloudflare-dns-token, readable by the container user only).
  mail:
    <<: *hardening
    image: stalwartlabs/stalwart:v0.16.24
    restart: unless-stopped
    # Runs as the image's unprivileged `stalwart` user (uid 2000). Its binary carries the
    # cap_net_bind_service file capability, so that one capability must stay in the bounding set
    # (without it exec fails with "operation not permitted").
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 512m
    pids_limit: 256
    ports:
      - '25:25'
      - '465:465'
      - '993:993'
      - '127.0.0.1:8080:8080'
    # Containers reach the mail server by its public name directly over the internal network (the
    # host can't hairpin its own public IP back into Docker), so TLS still matches mail.triad-vision.de.
    networks:
      default:
        aliases: [mail.triad-vision.de]
    volumes:
      - ./data/mail/etc:/etc/stalwart
      - ./data/mail/data:/var/lib/stalwart
      - ./data/mail/cloudflare-dns-token:/run/secrets/cloudflare-dns-token:ro

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    <<: *hardening
    restart: unless-stopped
    # Caddy only needs to bind 80/443; its filesystem is read-only apart from the cert/config volumes.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    pids_limit: 128
    env_file: .env.production
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    depends_on:
      - api
