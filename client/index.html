<!doctype html>
<!--tv:/* Language of the URL: /de/…, /en/…, /ru/…, /tr/…, /uk/…; the root is Azerbaijani (see deploy/Caddyfile). */:tv-->
<!--tv:$seg := index (splitList "/" .OriginalReq.URL.Path) 1:tv--><!--tv:$lang := "az":tv--><!--tv:if has $seg (list "de" "en" "ru" "tr" "uk"):tv--><!--tv:$lang = $seg:tv--><!--tv:end:tv-->
<!--tv:/* Unknown URL (no such page, missing or expired content): the API's /__seo/status answers "404" and the
  page stops with a 404, which deploy/Caddyfile (handle_errors) answers with this same shell and status 404 —
  crawlers get a real 404, visitors the app's "not found" page. Skipped while rendering that error page. */:tv-->
<!--tv:if not (placeholder "http.error.status_code"):tv--><!--tv:if eq (httpInclude (printf "/__seo/status?path=%s" (urlquery .OriginalReq.URL.Path))) "404":tv--><!--tv:httpError 404:tv--><!--tv:end:tv--><!--tv:end:tv-->
<!--tv:/* Server-rendered page (SSR service, client/ssr/server.mjs): the real page markup inside #root, which the
  app hydrates (src/main.tsx), and after #root the JSON it was rendered with (a script element of type
  application/json: never executed, so no CSP hash). The service answers "markup@@tv-ssr-state@@script", or
  nothing when the page is not server-rendered (private path, error, timeout) — then #root gets the crawler HTML
  from the API (/__seo/body) and the app renders on the client, as before. Asked for before the head element (no literal tag in this comment: Vite injects its dev scripts after the
  first one it finds): the head
  skips the /api/public/content preload when the page data came with the markup. */:tv-->
<!--tv:$ssr := splitList "@@tv-ssr-state@@" (httpInclude (printf "/__ssr/render?url=%s" (urlquery .OriginalReq.URL.RequestURI))):tv-->
<!--tv:if $lang:tv--><!--tv:printf "<html lang=\"%s\" dir=\"ltr\">" $lang:tv--><!--tv:else:tv--><html lang="az" dir="ltr"><!--tv:end:tv-->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--tv:/* White-label brand tags (theme colour, favicon, app icons, app title, Search Console verification,
      <meta name="tv-brand">) from the API's /__seo/brand (server/src/lib/brand/web.ts); the static Triad Vision
      tags are the fallback. */:tv-->
    <!--tv:$brand := httpInclude "/__seo/brand":tv-->
    <!--tv:if $brand:tv--><!--tv:$brand:tv--><!--tv:else:tv-->
    <meta name="google-site-verification" content="W7ASmkW0-5qq0rKMp2DrlQfP0kCTxliKR5rQQgiH7w4" />
    <meta name="theme-color" content="#0b1f44" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Triad Vision" />
    <!--tv:end:tv-->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Third-party origin used on most pages: the Cloudflare analytics beacon. Photos (CMS covers, stock photos)
         come from our own origin as resized WebP (/api/img, client/src/lib/img.ts): no photo origin to preconnect. -->
    <link rel="dns-prefetch" href="https://static.cloudflareinsights.com" />
    <!-- Crawler HTML inside #root (Caddy include of /__seo/body): readable without JavaScript, hidden as soon as
         JavaScript runs (the script below adds html.js) — React replaces it on its first render. -->
    <style>
      html.js .ssr { display: none }
      html.tv-relocate #root { visibility: hidden }
      html.tv-consented [data-cookie-banner] { display: none }
      .ssr { max-width: 60rem; margin: 0 auto; padding: 1rem 1rem 3rem; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; color: #0b1f44 }
      .ssr a { color: #1d4ed8 } .ssr ul, .ssr ol { padding-left: 1.25rem } .ssr nav ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: .25rem 1rem }
      .ssr table { border-collapse: collapse } .ssr th, .ssr td { border: 1px solid #cbd5e1; padding: .25rem .5rem; text-align: left }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--tv:/*
      SEO head tags. In production Caddy runs this file through its `templates` handler; the "tv:"
      comments below are its template actions (custom delimiters, see deploy/Caddyfile). They include the
      page-specific tags from the API (/__seo/head) and drop the static fallbacks; if the API returns
      nothing, the fallbacks stay. In the Vite dev server they are plain comments and the fallbacks apply.
      src/lib/usePageTitle.ts updates the tags on client-side navigation (it replaces every data-seo element).
    */:tv-->
    <!--tv:$seo := httpInclude (printf "/__seo/head?path=%s&lng=%s" (urlquery .OriginalReq.URL.Path) (urlquery (.OriginalReq.URL.Query.Get "lng"))):tv-->
    <!--tv:if $seo:tv--><!--tv:$seo:tv--><!--tv:else:tv-->
    <title>Triad Vision — People · Work · Opportunities</title>
    <meta data-seo name="description" content="Triad Vision — Azərbaycandan Almaniyaya etibarlı işçi təminatı və viza həlləri." />
    <!--tv:end:tv-->
    <script>
      // Theme + accessibility preferences (same key as src/lib/prefs.ts) applied before the app loads, so
      // the page never flashes light-on-dark or jumps in text size.
      (function () {
        var p = {};
        try { p = JSON.parse(localStorage.getItem('tv_prefs') || '{}') || {}; } catch (e) {}
        try {
          var q = new URLSearchParams(location.search).get('theme');
          if (q === 'dark' || q === 'light' || q === 'system') p.theme = q;
        } catch (e) {}
        var h = document.documentElement;
        h.classList.add('js');
        // A stored language other than az on an unprefixed public URL: the app moves to /<lng>/… before its first
        // render (lib/siteLocale.ts). Hide the server-rendered az markup until then (main.tsx drops the class).
        try {
          var sl = localStorage.getItem('tv_lang');
          if (sl && /^(de|en|ru|tr|uk)$/.test(sl) && !/^\/(de|en|ru|tr|uk)(\/|$)/.test(location.pathname)) h.classList.add('tv-relocate');
        } catch (e) {}
        // Cookie choice already made (lib/consent.ts): the server-rendered banner stays hidden.
        try {
          var cc = JSON.parse(localStorage.getItem('tv.consent') || 'null');
          if (cc && typeof cc.analytics === 'boolean' && typeof cc.marketing === 'boolean') h.classList.add('tv-consented');
        } catch (e) {}
        var dark = p.theme === 'dark' || (p.theme !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        h.setAttribute('data-theme', dark ? 'dark' : 'light');
        h.style.colorScheme = dark ? 'dark' : 'light';
        var c = [];
        if (p.contrast) c.push('a11y-contrast');
        if (p.lineHeight === 1.5) c.push('a11y-lineheight-15');
        if (p.lineHeight === 2) c.push('a11y-lineheight-20');
        if (p.letterSpacing === 0.05) c.push('a11y-spacing-05');
        if (p.letterSpacing === 0.1) c.push('a11y-spacing-10');
        if (p.readableFont) c.push('a11y-font');
        if (p.bigCursor) c.push('a11y-cursor');
        if (p.highlightLinks) c.push('a11y-links');
        if (p.hideImages) c.push('a11y-noimg');
        if (p.colorMode === 'gray') c.push('a11y-gray');
        if (p.colorMode === 'invert') c.push('a11y-invert');
        if (p.ruler) c.push('a11y-ruler');
        if (p.focusRing) c.push('a11y-focus');
        if (p.noMotion) c.push('a11y-nomotion');
        if (p.visualAlerts) c.push('a11y-visual-alerts');
        for (var i = 0; i < c.length; i++) h.classList.add(c[i]);
        if ([112, 125, 150].indexOf(p.fontScale) !== -1) h.style.fontSize = p.fontScale + '%';
      })();
    </script>
  </head>
  <body>
    <!-- Cloudflare e-mail obfuscation is switched off for the page markup (the markers around the includes):
         it would rewrite the address there and add a render-blocking decoder script to every page. -->
    <div id="root"><!--tv:if eq (len $ssr) 2:tv--><!--tv:index $ssr 0:tv--><!--tv:else:tv--><!--email_off--><!--tv:httpInclude (printf "/__seo/body?path=%s" (urlquery .OriginalReq.URL.Path)):tv--><!--/email_off--><!--tv:end:tv--></div><!--tv:if eq (len $ssr) 2:tv--><!--tv:index $ssr 1:tv--><!--tv:end:tv-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
